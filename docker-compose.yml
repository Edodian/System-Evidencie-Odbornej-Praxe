version: '3.8'

services:
  # MariaDB
  mariadb:
    image: mariadb:11.2
    container_name: dev-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sep_dev
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:Z
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak (OAuth 2.0 Authorization Server)
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: dev-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    networks:
      - app-network

  # Spring Boot backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: dev-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-dev}
    ports:
      - "8081:8081"
      - "5005:5005"
    volumes:
      - ./Backend:/app:Z
      - maven_cache:/root/.m2:Z
    networks:
      - app-network
    depends_on:
      mariadb:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  # Vue.js frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: dev-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    networks:
      - app-network
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: dev-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mariadb_data:
  maven_cache:
  frontend_node_modules:
